name: verify

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Keyed on the pull request only: a superseded head must be cancelled, and a
# cancelled run is a superseded head rather than a verification failure.
concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate-self-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate head without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run the candidate's own hermetic gate
        working-directory: .candidate
        run: python3 scripts/run_all.py

  verify:
    needs: candidate-self-tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The cook cannot self-approve: validator bytes come from the default
      # branch, the candidate is only ever data underneath them.
      - name: Checkout trusted validators from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact candidate head as data without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Assert both checkouts are the exact expected commits
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -C .candidate rev-parse HEAD)" = "$EXPECTED_HEAD"
          git -C .trusted rev-parse HEAD

      # REPO_ROOT in scripts/common.py defaults to the validator's own tree, so
      # every validator takes --root; trusted code, candidate tree.
      - name: Run trusted validators against the candidate tree
        run: |
          set -euo pipefail
          for gate in check_agents_hops check_skill_bundles check_admissions; do
            python3 ".trusted/scripts/$gate.py" --root "$GITHUB_WORKSPACE/.candidate"
          done

      - name: Produce exact-head trusted receipt
        env:
          RECEIPT: ${{ github.workspace }}/skill-concerns-receipt.json
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERIFY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          receipt = {
              "schema_version": 1,
              "repository": os.environ["REPOSITORY"],
              "pull_request": int(os.environ["PR_NUMBER"]),
              "head_sha": os.environ["HEAD_SHA"],
              "head_repository": os.environ["HEAD_REPOSITORY"],
              "base_ref": os.environ["BASE_REF"],
              "base_sha": os.environ["BASE_SHA"],
              "verify_run_id": int(os.environ["VERIFY_RUN_ID"]),
              "trusted_sha": subprocess.run(
                  ["git", "-C", ".trusted", "rev-parse", "HEAD"],
                  capture_output=True, text=True, check=True,
              ).stdout.strip(),
          }
          assert len(receipt["head_sha"]) == 40, receipt["head_sha"]
          path = os.environ["RECEIPT"]
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, indent=2, sort_keys=True)
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skill-concerns-receipt
          path: skill-concerns-receipt.json
          if-no-files-found: error
          retention-days: 7
