name: land

on:
  workflow_run:
    workflows: [verify]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: land-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  land:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      # The receipt, not the workflow_run head, names the verified commit:
      # a pull_request_target run reports the base sha, never the candidate's.
      - name: Download the exact verify receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: skill-concerns-receipt
          path: receipt
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Exact-head merge, Issue closure and marker stamp with readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/land_pr.py
          --receipt "$GITHUB_WORKSPACE/receipt/skill-concerns-receipt.json"
          --policy policy/github.json
